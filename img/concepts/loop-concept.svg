    <path d="M331 317C357 299 411 299 437 317L464 348C480 368 480 400 464 420L437 451C411 469 357 469 331 451L304 420C288 400 288 368 304 348L331 317Z" fill="#10263A" stroke="#4C7DFF" stroke-width="3"/>
    <circle cx="384" cy="384" r="42" fill="#06141F" stroke="#B875FF" stroke-width="4"/>
    <circle cx="384" cy="384" r="18" fill="#9AFBFF"/>
  </g>

  <g stroke="#7DF9FF" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M314 284L267 235"/>
    <path d="M454 284L501 235"/>
    <path d="M314 484L267 533"/>
    <path d="M454 484L501 533"/>
  </g>
  <g fill="#10263A" stroke="#7DF9FF" stroke-width="3" filter="url(#hardGlow)">
    <rect x="232" y="203" width="70" height="44" rx="7"/>
    <rect x="466" y="203" width="70" height="44" rx="7"/>
    <rect x="232" y="521" width="70" height="44" rx="7"/>
    <rect x="466" y="521" width="70" height="44" rx="7"/>
  </g>
  <g fill="#99F8FF" font-family="Consolas, monospace" font-size="22" text-anchor="middle">
