<svg width="768" height="768" viewBox="0 0 768 768" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="768" height="768" fill="#071018"/>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FF6FF" stop-opacity="0.88"/>
      <stop offset="38%" stop-color="#22B8D8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanStroke" x1="164" y1="176" x2="604" y2="592" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF9FF"/>
      <stop offset="0.5" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#B875FF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="384" cy="384" r="270" fill="url(#coreGlow)" opacity="0.45"/>
  <circle cx="384" cy="384" r="236" stroke="#1A3340" stroke-width="2" stroke-dasharray="5 14"/>

  <g opacity="0.55" font-family="Consolas, monospace" font-size="23" fill="#5AD7FF">
    <text x="118" y="164">for(i=0;i&lt;n;i++)</text>
    <text x="520" y="214">while(true)</text>
    <text x="96" y="586">{ repeat }</text>
    <text x="510" y="618">i++</text>
    <text x="174" y="662">loop()</text>
  </g>

