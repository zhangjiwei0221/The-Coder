    <path d="M532 391C532 483 466 550 377 550C300 550 250 512 215 454" stroke="url(#cyanStroke)" stroke-width="28" stroke-linecap="round"/>
    <path d="M236 485L195 412L278 415" stroke="#B875FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#hardGlow)">
