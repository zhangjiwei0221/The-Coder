<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coder</title>
<link href="https://fonts.font.im/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- TITLE --><div id="screen-title" class="screen"><h1>THE CODER</h1><div class="subtitle">像写代码一样打牌，看着自己的程序击败敌人</div><button onclick="Game.startRun()">开始游戏</button></div>
<!-- MAP --><div id="screen-map" class="screen hidden"><div id="map-header"><h2>// 选择路径</h2><div id="map-player-info"><span>HP: <span id="map-hp" class="hp-val"></span></span><span>金币: <span id="map-gold" class="gold-val"></span></span></div></div><div id="map-layer-name"></div><div id="map-container"></div></div>
<!-- BATTLE --><div id="screen-battle" class="screen hidden">
<div id="battle-top">
  <div id="battle-turn"></div>
  <div id="enemy-ui">
    <div id="enemy-editor-panel" class="enemy-ui-panel">
      <div class="panel-title">// CURRENT CODE</div>
      <div class="enemy-intent" id="enemy-intent"></div>
    </div>
    <div id="enemy-center-panel">
      <div id="enemy-area">
        <div class="enemy-sprite" id="enemy-sprite"></div>
        <div class="enemy-info-col">
          <div class="enemy-name" id="enemy-name"></div>
          <div class="hp-bar-container"><div class="hp-bar-fill" id="enemy-hp-bar"></div><div class="hp-bar-text" id="enemy-hp-text"></div></div>
          <div style="display:flex;gap:8px;align-items:center;"><div class="shield-bar" id="enemy-shield"></div><div class="status-effects" id="enemy-status"></div></div>
        </div>
      </div>
    </div>
    <div id="enemy-library-panel" class="enemy-ui-panel">
      <div class="panel-title">// 代码库 + 能力</div>
      <div id="enemy-code-lib" class="enemy-code-lib"></div>
      <div id="enemy-ability" class="enemy-ability"></div>
    </div>
  </div>
</div>
<div id="battle-middle"><div id="player-panel"><div class="panel-title">// 玩家</div><div class="player-stat"><span class="stat-label">HP</span><span class="stat-val hp-green" id="player-hp"></span></div><div class="player-stat"><span class="stat-label">护盾</span><span class="stat-val shield-blue" id="player-shield"></span></div><div class="player-stat"><span class="stat-label">状态</span><div class="status-effects" id="player-status"></div></div><div class="player-stat"><span class="stat-label">参数</span><span class="stat-val" id="param-sum" style="color:var(--purple)"></span></div><div class="player-stat"><span class="stat-label">牌堆</span><span class="pile-info" id="pile-info"></span></div><div class="player-stat"><span class="stat-label">插件</span><div id="player-plugins"></div></div></div><div id="battle-center"><div id="program-section"><div id="program-header"><span>// 编程区</span></div><div id="program-lines"></div></div><div id="action-buttons"><button id="btn-run" onclick="Game.battle.runCode()">▶ 运行</button><button id="btn-clear" onclick="Game.battle.clearProgram()">清空</button></div></div><div id="battle-log"><div class="panel-title">// 战斗日志</div><div id="log-entries"></div></div></div>
<div id="battle-bottom"><div id="hand-section"><div id="hand-label">// 手牌</div><div id="hand-cards"></div></div></div>
</div>
<!-- REWARD --><div id="screen-reward" class="screen hidden"><h2>// 选择奖励</h2><div id="reward-cards"></div><button id="btn-skip-reward" onclick="Game.skipReward()">跳过</button></div>
<!-- EVENT --><div id="screen-event" class="screen hidden"><div class="event-icon" id="event-icon"></div><h2 id="event-title"></h2><div class="event-desc" id="event-desc"></div><div id="event-choices"></div></div>
<!-- GAME OVER --><div id="screen-gameover" class="screen hidden"><h2 id="gameover-title"></h2><div class="stats" id="gameover-stats"></div><button onclick="Game.backToTitle()">返回主界面</button></div>
<!-- CHAR SELECT --><div id="screen-charselect" class="screen hidden"><h2 style="font-family:'Orbitron';color:var(--blue)">// 选择角色</h2><div id="char-cards" style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;"></div></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
